[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "digital-pen"
version = "0.1.0"
description = "PC reference pipeline for an ESP32-S3 OV5640 Anoto digital pen"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "opencv-python>=4.10",
    "requests>=2.32",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
codec = ["microdots>=1.0.0"]
dev = ["pytest>=9.0", "ruff>=0.16"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
